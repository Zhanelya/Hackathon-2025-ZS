[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booking-mcp"
version = "0.1.0"
description = "MCP server for travel booking search and reservations (DEMO ONLY)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
]

[project.scripts]
booking-mcp = "booking_mcp.main:main"